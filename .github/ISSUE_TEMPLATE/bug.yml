name: Bug report
description: Report a reproducible defect without private conversation data.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value:
        Never include API keys, `.env` contents, private prompts, or databases.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: List deterministic steps and use synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, browser, and Node version
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data check
      options:
        - label: I removed credentials and private conversation data.
          required: true
        - label: This is not a security vulnerability.
          required: true
