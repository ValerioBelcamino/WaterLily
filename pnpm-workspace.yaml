packages:
  - apps/*
  - packages/*

nodeLinker: hoisted

allowBuilds:
  # better-sqlite3 ships the desktop targets we support as prebuilt binaries.
  # Skipping node-gyp keeps clean installs portable across hosted runners.
  better-sqlite3: false
  electron-winstaller: true
  esbuild: false
  fs-xattr: true
  macos-alias: true

catalog:
  '@electron-forge/cli': ^7.11.2
  '@electron-forge/maker-deb': ^7.11.2
  '@electron-forge/maker-dmg': ^7.11.2
  '@electron-forge/maker-squirrel': ^7.11.2
  '@electron-forge/maker-zip': ^7.11.2
  '@electron-forge/plugin-fuses': ^7.11.2
  '@electron-forge/shared-types': ^7.11.2
  '@electron/fuses': ^2.1.3
  '@eslint/js': ^10.0.1
  '@playwright/test': ^1.63.0
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.7
  '@types/better-sqlite3': ^9.6.0
  '@types/electron-squirrel-startup': ^1.0.2
  '@types/node': ^26.5.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.1
  '@vitest/coverage-v8': ^5.0.0
  '@xyflow/react': ^12.11.6
  better-sqlite3: ^13.0.3
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  electron: ^44.3.0
  electron-squirrel-startup: ^1.0.1
  eslint: ^10.10.0
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.6
  fast-check: ^4.10.0
  fflate: ^0.8.3
  jsdom: ^30.0.1
  lucide-react: ^1.45.0
  prettier: ^3.9.6
  react: ^19.3.0
  react-dom: ^19.3.0
  turbo: ^2.10.12
  typescript: ^7.0.2
  typescript-eslint: ^8.70.0
  vite: ^8.3.0
  vitest: ^5.0.0
  zustand: ^5.0.15

catalogMode: strict

# Forge 7 advertises fuses v1 as a peer, but its plugin delegates to the
# versioned @electron/fuses API and supports v2 (as documented by Forge).
peerDependencyRules:
  allowedVersions:
    '@electron/fuses': '2'

# Forge 7's rebuild dependency references this published Electron fork by Git
# commit. Resolve the identical version from npm so pnpm can keep blocking
# undeclared exotic subdependencies. Remove this override after Forge 8.
overrides:
  '@electron/node-gyp': 10.2.0-electron.1
